limit_req_zone $binary_remote_addr zone=chessprep_api:10m rate=10r/s;

map $uri $chessprep_csp {
    default "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'";
    ~^/api/docs/?$ "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'";
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 6m;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy $chessprep_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-XSS-Protection "0" always;

    location /api/ {
        limit_req zone=chessprep_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /vendor/ {
        try_files $uri =404;
        expires 7d;
    }

    location /js/ {
        try_files $uri =404;
        expires -1;
    }

    location = /app.js {
        expires -1;
    }

    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Type "application/javascript";
    }

    location = /manifest.json {
        try_files $uri =404;
        add_header Content-Type "application/json";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

